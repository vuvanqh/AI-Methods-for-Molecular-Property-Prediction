[project]
name = "app"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.159.1",
    "pgvector>=0.5.1",
    "psycopg[binary]>=3.3.8",
    "rdkit>=2026.9.1",
    "sqlalchemy>=2.1.8",
    "uvicorn>=0.54.0",
]

[tool.ruff.format]
skip-magic-trailing-comma = false

[tool.ruff.lint]
ignore = ["B008"]  # FastAPI's Depends() defaults
