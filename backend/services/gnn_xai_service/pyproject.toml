[project]
name = "gnn-xai-service"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "captum>=0.9.0",
    "chemprop>=2.3.1",
    "fastapi[standard]>=0.159.1",
    "torch>=2.15.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.ruff.lint]
ignore = ["SIM117"]  # nested `with` blocks in tests read fine

# inference only, and Docker has no GPU: the CPU build skips PyPI Linux torch's ~3 GB of CUDA libraries
[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true