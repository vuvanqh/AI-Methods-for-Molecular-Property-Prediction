server {
    listen 80;
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
    location /api/ {
        # docker's embedded dns; the variable forces nginx to re-resolve per request,
        # otherwise it caches the api container's ip at startup and 502s once it restarts
        resolver 127.0.0.11 valid=10s;
        set $api_host api;
        proxy_pass http://$api_host:8001;
        proxy_set_header Host $host;
        # a prediction runs the GNN, ChEMBL and the LLM; nginx would otherwise cut it off at 60s
        proxy_read_timeout 300s;
    }
}
