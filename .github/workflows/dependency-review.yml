# Intercepts PR's in real time before they are merged and checks if a vulnrerable third-party package/incompatible sorftware licence was introduced. If so it will immediatelly fail the PR
name: "Dependency Review"

on:
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  dependency-review:
    name: "Review Dependencies"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v4

      - name: "Dependency Review"
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: moderate
