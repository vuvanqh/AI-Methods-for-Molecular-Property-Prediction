name: "CI"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# least privilege: every job only checks out code and runs lint/tests/builds (artifact upload needs no token scope)
permissions:
  contents: read

jobs:
  backend-ci:
    name: "Backend CI (${{ matrix.project }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # each backend service is its own uv project: own pyproject.toml, uv.lock and Python pin
        # (.python-version in the service folder, else the repo root's), so CI runs the versions used locally
        project: ["app", "services/gnn_xai_service"]
    defaults:
      run:
        working-directory: backend/${{ matrix.project }}

    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v7

      - name: "Set up uv"
        uses: astral-sh/setup-uv@v10.3.3  # no moving major tag (v10) is published; Dependabot bumps this
        with:
          enable-cache: true
          cache-dependency-glob: backend/${{ matrix.project }}/uv.lock

      - name: "Install dependencies"
        run: uv sync --locked

      - name: "Lint with Ruff"
        run: uvx ruff check .

      - name: "Run tests"
        run: |
          if [ -d tests ]; then
            uv run pytest
          else
            echo "No tests in backend/${{ matrix.project }} yet. Skipping pytest."
          fi

  frontend-ci:
    name: "Frontend CI"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v7

      - name: "Check for frontend files"
        id: check-frontend
        run: |
          if [ -f package.json ]; then
            echo "has_code=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_code=false" >> "$GITHUB_OUTPUT"
            echo "No package.json found in frontend/. Skipping frontend CI."
          fi

      - name: "Set up Node.js 24"  # vitest 5 / jsdom need Node >= 22
        if: steps.check-frontend.outputs.has_code == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: ${{ hashFiles('frontend/package-lock.json') != '' && 'npm' || '' }}
          cache-dependency-path: frontend/package-lock.json

      - name: "Install dependencies"
        if: steps.check-frontend.outputs.has_code == 'true'
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: "Run lint, tests with coverage, and build"
        if: steps.check-frontend.outputs.has_code == 'true'
        run: |
          npm run lint --if-present
          npm run test:coverage
          npm run build --if-present

  frontend-e2e:
    name: "Frontend E2E (Playwright)"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v7

      - name: "Set up Node.js 24"
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: "Install dependencies"
        run: npm ci

      - name: "Install Chromium"
        run: npx playwright install --with-deps chromium

      - name: "Run E2E tests (mocked API)"
        run: npm run test:e2e

      - name: "Upload Playwright report"
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7