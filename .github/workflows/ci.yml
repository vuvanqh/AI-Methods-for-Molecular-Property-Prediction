name: "CI"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-ci:
    name: "Backend CI (Python ${{ matrix.python-version }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    defaults:
      run:
        working-directory: backend

    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v4

      - name: "Set up Python ${{ matrix.python-version }}"
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: |
            backend/requirements*.txt
            backend/pyproject.toml

      - name: "Install dependencies"
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          elif [ -f pyproject.toml ]; then
            pip install .
          else
            echo "No requirements.txt or pyproject.toml found in backend/ yet. Skipping dependency install."
          fi
          pip install ruff pytest httpx

      - name: "Lint with Ruff"
        run: |
          if [ -f requirements.txt ] || [ -f pyproject.toml ] || [ -d "app" ] || [ -d "src" ]; then
            ruff check .
          else
            echo "Backend code not scaffolded yet. Skipping lint."
          fi

      - name: "Run backend tests"
        run: |
          if [ -d "tests" ]; then
            pytest
          else
            echo "No backend/tests directory found yet. Skipping pytest."
          fi

  frontend-ci:
    name: "Frontend CI (React 19+)"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v4

      - name: "Set up Node.js 20"
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: "Install dependencies"
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          elif [ -f package.json ]; then
            npm install
          else
            echo "No package.json found in frontend/ yet. Skipping npm install."
          fi

      - name: "Run lint and build"
        run: |
          if [ -f package.json ]; then
            npm run lint --if-present
            npm run build --if-present
          else
            echo "Frontend code not scaffolded yet. Skipping build."
          fi
