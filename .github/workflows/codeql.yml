# For semantic static code analysis
name: "CodeQL"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: "30 2 * * 1" # Runs weekly on Monday at 02:30 UTC

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: "Analyze (${{ matrix.language }})"
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix: # simply for parallelization
        include:
          - language: "javascript-typescript"
            build-mode: "none"
          - language: "python"
            build-mode: "none"

    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v4

      - name: "Check if ${{ matrix.language }} files exist"
        id: check-code
        run: |
          if [ "${{ matrix.language }}" = "python" ]; then
            if find . -name "*.py" -not -path "*/.*" | grep -q .; then
              echo "has_files=true" >> "$GITHUB_OUTPUT"
            else
              echo "has_files=false" >> "$GITHUB_OUTPUT"
              echo "No Python files found yet. Skipping CodeQL analysis."
            fi
          elif [ "${{ matrix.language }}" = "javascript-typescript" ]; then
            if find . \( -name "*.js" -o -name "*.jsx" -o -name "*.ts" -o -name "*.tsx" \) -not -path "*/.*" -not -path "*/node_modules/*" | grep -q .; then
              echo "has_files=true" >> "$GITHUB_OUTPUT"
            else
              echo "has_files=false" >> "$GITHUB_OUTPUT"
              echo "No JavaScript/TypeScript files found yet. Skipping CodeQL analysis."
            fi
          fi

      - name: "Initialize CodeQL"
        if: steps.check-code.outputs.has_files == 'true'
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: +security-extended,security-and-quality

      - name: "Perform CodeQL Analysis"
        if: steps.check-code.outputs.has_files == 'true'
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
